[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-system-monitor"
version = "0.1.0"
description = "Local Windows hardware and system monitoring desktop application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
