name: Windows build

on:
  push:
    branches: [0.1dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone application
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name HORIZION --collect-all PySide6 --collect-all shiboken6 main.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: HORIZION-Windows-Installer
          path: Output/HORIZION-Setup.exe
          if-no-files-found: error
          retention-days: 14
